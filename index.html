<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>LetsFly</title>
		<link 
			rel="stylesheet" 
			href="./dist/css/preflight-dist.min.css"
		>
		<link
			rel="stylesheet"
			href="./dist/css/main.min.css"
		/>
		<link
			rel="stylesheet"
			href="/css/main.css"
		/>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz@0,14..32;1,14..32&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="icon"
			href="./assets/images/favicon.svg"
		/>
	</head>
	<body>
		<header class="header container">
			<a
				href="/"
				class="header__logo"
			>
				LetsFly
			</a>
			<nav class="header__menu">
				<ul class="header__menu_links">
					<li><a href="#">Intro</a></li>
					<li><a href="#">About</a></li>
					<li><a href="#">Costs</a></li>
					<li><a href="#">Features</a></li>
					<li><a href="#">FAQ</a></li>
				</ul>
			</nav>
		</header>

		<main class="welcome">

			<div class="welcome__information">
				<div class="welcome__text">
					<p class="welcome__sub-text">Personal jets<p>
					<h1 class="welcome__title">Luxury.</h1>
					<h1 class="welcome__second_title">Affordable.</h1>
					<h2 class="welcome__motto">We believe loyalty should be rewarded.</h2>
				</div>

				<div class="welcome__cta">
					<button class="welcome__btn">Learn more</button>
					<button class="welcome__btn_primary">Let's Fly</button>
				</div>
			</div>

			<!-- draggable - запрещает перетягивать картинку -->
			<img src="./assets/images/plane/01.png" alt="" class="welcome__plane" draggable="false" >



		</main>
	</body>
</html>
